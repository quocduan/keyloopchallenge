scheduler:
  # Tests use the existing database locking behavior without requiring a Redis cluster.
  booking:
    redis-locks-enabled: false
spring:
  datasource:
    url: ${TEST_MYSQL_URL:jdbc:mysql://localhost:3306/scheduler_test?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL}
    username: ${TEST_MYSQL_USERNAME:scheduler}
    password: ${TEST_MYSQL_PASSWORD:scheduler}
  flyway:
    enabled: true
  sql:
    init:
      mode: never
